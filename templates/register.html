{% extends "base.html" %}

{% block title %}회원가입 - Tiny Market{% endblock %}

{% block content %}
<h2>회원가입</h2>

<form method="post" action="{{ url_for('register') }}">
    <div>
        <label for="username">아이디</label>
        <input
            type="text"
            id="username"
            name="username"
            value="{{ username|default('') }}"
            minlength="4"
            maxlength="30"
            autocomplete="username"
            required
        >
    </div>

    <div>
        <label for="password">비밀번호</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >
    </div>

    <div>
        <label for="password_confirm">비밀번호 확인</label>
        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            minlength="8"
            required
        >
    </div>

    <button type="submit">가입하기</button>
</form>
{% endblock %}
