{% extends "base.html" %}

{% if is_edit %}
    {% set page_title = "상품 수정" %}
{% else %}
    {% set page_title = "상품 등록" %}
{% endif %}

{% block title %}{{ page_title }} - Tiny Market{% endblock %}

{% block content %}
<h2>{{ page_title }}</h2>

{% if is_edit %}
<form
    method="post"
    action="{{ url_for('edit_product', product_id=product.id) }}"
>
{% else %}
<form
    method="post"
    action="{{ url_for('create_product') }}"
>
{% endif %}
    <div>
        <label for="title">상품명</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ title|default('') }}"
            minlength="2"
            maxlength="100"
            required
        >
    </div>

    <div>
        <label for="description">상품 설명</label>
        <br>
        <textarea
            id="description"
            name="description"
            rows="8"
            cols="60"
            maxlength="2000"
            required
        >{{ description|default('') }}</textarea>
    </div>

    <div>
        <label for="price">가격</label>
        <input
            type="number"
            id="price"
            name="price"
            value="{{ price|default('') }}"
            min="1"
            max="100000000"
            required
        >
        원
    </div>

    <button type="submit">
        {% if is_edit %}수정하기{% else %}등록하기{% endif %}
    </button>
</form>
{% endblock %}
