{% extends "base.html" %}

{% block title %}포인트 송금 - Tiny Market{% endblock %}

{% block content %}
<h2>포인트 송금</h2>

<p>
    현재 보유 포인트:
    <strong>{{ current_user.points }}점</strong>
</p>

<form method="post" action="{{ url_for('transfer') }}">
    <div>
        <label for="receiver_username">받는 사용자 아이디</label>
        <input
            type="text"
            id="receiver_username"
            name="receiver_username"
            value="{{ receiver_username|default('') }}"
            maxlength="30"
            required
        >
    </div>

    <div>
        <label for="amount">송금 포인트</label>
        <input
            type="number"
            id="amount"
            name="amount"
            value="{{ amount|default('') }}"
            min="1"
            required
        >
    </div>

    <button type="submit">송금하기</button>
</form>

<p>
    <a href="{{ url_for('transactions') }}">
        송금 내역 보기
    </a>
</p>
{% endblock %}
